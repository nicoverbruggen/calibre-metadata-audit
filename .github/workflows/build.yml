name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test plugin packaging
        run: python3 -m unittest discover -s tests -p test_build.py

      - name: Build and verify installable ZIP
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python3 tools/build_plugin.py --release-tag "$RELEASE_TAG"
          else
            python3 tools/build_plugin.py
          fi

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Metadata-Audit
          path: dist/Metadata-Audit-*.zip
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download plugin ZIP
        uses: actions/download-artifact@v4
        with:
          name: Metadata-Audit
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/Metadata-Audit-*.zip \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
